<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiny Notes, Big Beats — a kawaii rhythm showreel</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;--res:76px}
@media (max-width:760px),(max-height:520px){:root{--res:122px}}
html,body{margin:0;height:100%;background:#2e2140;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif;color:#fff;overflow:hidden}
#wrap{position:fixed;inset:0;height:100vh;height:100dvh;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
canvas{width:min(98vw,calc((100dvh - var(--res))*16/9));aspect-ratio:16/9;border-radius:20px;box-shadow:0 24px 70px #0009;background:#ffd6e8;cursor:pointer;display:block}
#bar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;align-items:center;width:min(98vw,calc((100dvh - var(--res))*16/9))}
button{white-space:nowrap;-webkit-tap-highlight-color:transparent;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:9px 18px;background:#ff8fbf;color:#3b2850;cursor:pointer;box-shadow:0 3px 0 #c7528a}
button:active{transform:translateY(2px);box-shadow:none}
#rec{background:#ffe27a;box-shadow:0 3px 0 #c9a63a}
input[type=range]{flex:1 1 180px;min-width:120px;accent-color:#ff8fbf}
#time{font-variant-numeric:tabular-nums;min-width:96px;white-space:nowrap;font-weight:700;opacity:.9}
body.rec #bar{opacity:.45;pointer-events:none}
#game{background:#7fe0c0;box-shadow:0 3px 0 #3fa484}
body.game #play,body.game #seek,body.game #time,body.game #rec{display:none}
body.game #bar{justify-content:center}
body.game canvas{touch-action:none}
#rot{display:none;font-weight:800;font-size:14px;opacity:.85;text-align:center}
/* phones: smaller buttons, seek bar on its own full-width row, no video-export button (phones can't record reliably) */
@media (max-width:760px){
  button{font-size:14px;padding:8px 14px}
  #play{order:1}#time{order:2;min-width:0;font-size:14px}#game{order:3}
  #seek{order:4;flex:1 1 100%}
  #rec{display:none}
}
@media (max-width:760px) and (orientation:portrait){#rot{display:block}}
@media (hover:none) and (pointer:coarse){#rec{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="rot">↻ Turn your phone sideways for a bigger picture</div>
  <div id="bar">
    <button id="play">▶ Play</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="time">0:00 / 0:00</span>
    <button id="rec">● Save video</button>
    <button id="game">🎮 Practice game</button>
  </div>
</div>
<script>
'use strict';
/* =========================================================
   TINY NOTES, BIG BEATS — kawaii rhythm explainer (pure HTML + JS)
   Canvas 1920x1080, deterministic timeline, WebAudio score.
   Space = play/pause · ←/→ = seek · ?t=SECONDS to jump
   ========================================================= */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1920, H=1080, BPM=100, BEAT=60/BPM, BAR=BEAT*4;
const FONT='ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Nunito","Varela Round",system-ui,sans-serif';
const C={ink:'#4a3358',pink:'#ff8fbf',pinkL:'#ffd9ea',mint:'#7fe0c0',mintL:'#d6f8ec',butter:'#ffd96b',butterL:'#fff4c9',
  lav:'#b9a3ff',lavL:'#ebe3ff',sky:'#82c9ff',skyL:'#dbf0ff',peach:'#ffb38a',peachL:'#ffe6d6',sub:'#7a6690'};
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};}

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t, fr=x=>x-Math.floor(x);
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const elastic=t=>{t=clamp(t);if(t===0||t===1)return t;return Math.pow(2,-10*t)*Math.sin((t*10-.75)*2*Math.PI/3)+1};
const prog=(lt,a,d)=>clamp((lt-a)/d);
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
let T=0;
const blinkAt=(t,s)=>{const p=(t+s*1.37)%3.7;return p<.14?Math.sin(p/.14*Math.PI):0};

/* ---------- note data ---------- */
const NOTES={
  w:{name:'Whole note',beats:4,filled:false,stem:false,flags:0,col:C.lav,slices:1},
  h:{name:'Half note',beats:2,filled:false,stem:true,flags:0,col:C.mint,slices:2},
  q:{name:'Quarter note',beats:1,filled:true,stem:true,flags:0,col:C.pink,slices:4},
  e:{name:'Eighth note',beats:.5,filled:true,stem:true,flags:1,col:C.sky,slices:8},
  s:{name:'Sixteenth note',beats:.25,filled:true,stem:true,flags:2,col:C.butter,slices:16},
};
const BEATS={w:'4',h:'2',q:'1',e:'½',s:'¼'};
const FACT={w:'Hollow head · no stem · hold it for 4 beats',h:'Hollow head + a stem · 2 beats',q:'Filled head + a stem · 1 beat',
  e:'Filled head + stem + 1 flag · half a beat',s:'Filled head + stem + 2 flags · a quarter of a beat'};
const PIZ={w:'= the WHOLE pizza',h:'= ½ of the pizza',q:'= ¼ of the pizza',e:'= ⅛ of the pizza',s:'= 1/16 of the pizza'};
const TIP={w:["I'm the longest note!","Hold me for the WHOLE bar."],h:["Two of me","fill one whole bar!"],
  q:["One beat each —","the most common note!"],e:["Two of us share one beat.","We hold hands with a BEAM!"],
  s:["FOUR of us squeeze","into ONE beat!"]};
function sayFor(p){ if(p.rest)return 'shh'; const k=p.type+(p.dot?'.':'');
  if(k==='s')return ['ti','ka','ti','ka'][Math.round(fr(p.b0)*4)%4];
  return {w:'ta-a-a-a',h:'ta-a','h.':'ta-a-a',q:'ta','q.':'ta-a',e:'ti'}[k]||'ta'; }
function seq(pat,b=0){return pat.map(tok=>{const type=tok[0],rest=tok.includes('r'),dot=tok.includes('.');
  const len=NOTES[type].beats*(dot?1.5:1);const o={type,rest,dot,b0:b,b1:b+len};b+=len;return o;});}
const rep=(t,n)=>Array(n).fill(t);

/* ---------- scenes ---------- */
const SC=[
 {id:'intro',bars:4,c:[C.pinkL,C.lavL]},
 {id:'beat',bars:5,c:[C.skyL,C.mintL],ch:'The beat'},
 {id:'anatomy',bars:5,c:[C.butterL,C.peachL],ch:'Parts of a note'},
 {id:'note',type:'w',bars:6,c:[C.lavL,C.pinkL]},
 {id:'note',type:'h',bars:5,c:[C.mintL,C.skyL]},
 {id:'note',type:'q',bars:5,c:[C.pinkL,C.butterL]},
 {id:'note',type:'e',bars:6,c:[C.skyL,C.lavL]},
 {id:'note',type:'s',bars:6,c:[C.butterL,C.mintL]},
 {id:'tree',bars:6,c:[C.lavL,C.skyL],ch:'The family tree',demo:{from:0,n:5,pats:[['w'],['h','h'],rep('q',4),rep('e',8),rep('s',16)]}},
 {id:'rests',bars:7,c:['#dfe3ff',C.lavL],ch:'Rests',demo:{from:3,n:3,pats:[['q','q','qr','q'],['q','qr','q','qr'],['h','hr']]}},
 {id:'dot',bars:6,c:[C.peachL,C.pinkL],ch:'Dotted notes',demo:{from:3,n:2,pats:[['h.','q']]}},
 {id:'clap',bars:9,c:[C.mintL,C.butterL],ch:'Clap along',demo:{from:1,n:7,pats:[
   ['q','q','q','q'],['q','q','h'],['e','e','e','e','q','q'],['h','q','qr'],['e','e','q','e','e','q'],['s','s','s','s','q','e','e','q'],['w']]}},
 {id:'outro',bars:5,c:[C.pinkL,C.lavL]},
];
let acc=0, chap=0;
SC.forEach(s=>{
  s.start=acc; s.dur=s.bars*BAR; acc+=s.dur;
  if(s.id==='note'){ s.ch=NOTES[s.type].name; s.demo={from:1,n:s.bars-3,pats:[rep(s.type,4/NOTES[s.type].beats)]}; }
  if(s.ch) s.num=++chap;
  s.hits=[]; s.barPats=[];
  if(s.demo){ const {from,n,pats}=s.demo;
    for(let k=0;k<n;k++){ const p=pats[k%pats.length]; s.barPats.push(seq(p,0)); s.hits.push(...seq(p,(from+k)*4)); } }
});
const TOTAL=acc;
const sceneAt=t=>{for(let i=SC.length-1;i>=0;i--) if(t>=SC[i].start) return i; return 0;};

/* ---------- drawing primitives ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),Math.max(0,h),Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2)));}
/* safety net: canvas throws on negative radii — clamp them globally so one bad frame can never kill the loop */
(()=>{const P=CanvasRenderingContext2D.prototype,oa=P.arc,oe=P.ellipse;
  P.arc=function(x,y,r,...a){return oa.call(this,x,y,r>0?r:0,...a);};
  P.ellipse=function(x,y,rx,ry,...a){return oe.call(this,x,y,rx>0?rx:0,ry>0?ry:0,...a);};})();
function blob(x,y,w,h,r,fill,stroke=C.ink,lw=7,shadow=true){
  if(w<=1||h<=1)return;
  if(shadow){ctx.fillStyle='rgba(74,51,88,.14)';rr(x,y+9,w,h,r);ctx.fill();}
  rr(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}
}
function circle(x,y,r,fill,stroke,lw=6){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function starPath(x,y,r,n=5,inner=.5,rot=-Math.PI/2){ctx.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,rad=i%2?r*inner:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();}
function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.3,y+s*.1,x-s*.7,y-s*.95,x,y-s*.35);ctx.bezierCurveTo(x+s*.7,y-s*.95,x+s*1.3,y+s*.1,x,y+s*.9);ctx.closePath();}
function txt(s,x,y,size,fill,o={}){
  ctx.save();ctx.globalAlpha*=(o.alpha??1);ctx.font=`${o.weight||800} ${size}px ${FONT}`;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';
  if(o.stroke){ctx.lineJoin='round';ctx.lineWidth=o.lw||8;ctx.strokeStyle=o.stroke;ctx.strokeText(s,x,y);}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);ctx.restore();
}
/* sticker text: each letter pops with overshoot, white die-cut border, ink outline */
function sticker(s,x,y,size,fill,lt,at=0,o={}){
  const stg=o.stagger??.035, align=o.align||'center', wob=o.wob||0;
  ctx.save();ctx.font=`900 ${size}px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='center';ctx.lineJoin='round';
  const ch=[...s], ws=ch.map(c=>ctx.measureText(c).width), gap=size*.03;
  const tw=ws.reduce((a,b)=>a+b,0)+gap*(ch.length-1);
  let cx=align==='center'?x-tw/2:align==='right'?x-tw:x; const items=[];
  ch.forEach((c,i)=>{const p=back(prog(lt,at+i*stg,.45));
    if(p>.001&&c!==' ')items.push({c,i,x:cx+ws[i]/2,y:y+Math.sin(T*4+i*.7)*wob,p}); cx+=ws[i]+gap;});
  for(let pass=0;pass<3;pass++) items.forEach(it=>{
    ctx.save();ctx.translate(it.x,it.y);ctx.rotate((1-Math.min(1,it.p))*.6*(it.i%2?1:-1));ctx.scale(it.p,it.p);
    if(pass===0){ctx.strokeStyle='rgba(74,51,88,.2)';ctx.lineWidth=size*.34;ctx.strokeText(it.c,0,size*.08);}
    else if(pass===1){ctx.strokeStyle='#fff';ctx.lineWidth=size*.32;ctx.strokeText(it.c,0,0);}
    else{ctx.strokeStyle=C.ink;ctx.lineWidth=size*.12;ctx.strokeText(it.c,0,0);ctx.fillStyle=fill;ctx.fillText(it.c,0,0);}
    ctx.restore();});
  ctx.restore();
}
function badge(x,y,s,col,p,size=40){
  if(p<=0)return; ctx.save();ctx.font=`900 ${size}px ${FONT}`;const w=ctx.measureText(s).width+size*1.3,h=size*1.6;
  ctx.translate(x,y);ctx.scale(p,p);blob(-w/2,-h/2,w,h,h/2,col,C.ink,6);txt(s,0,2,size,C.ink,{weight:900});ctx.restore();
}
function bubble(x,y,lines,p,size=38){
  if(p<=0)return; ctx.save();ctx.font=`800 ${size}px ${FONT}`;
  const w=Math.max(...lines.map(l=>ctx.measureText(l).width))+70, h=lines.length*size*1.3+38;
  ctx.translate(x,y+h);ctx.scale(p,p);ctx.translate(0,-h);
  ctx.fillStyle='rgba(74,51,88,.14)';rr(0,9,w,h,30);ctx.fill();
  ctx.beginPath();ctx.moveTo(46,h-6);ctx.lineTo(4,h+48);ctx.lineTo(112,h-6);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=6;ctx.lineJoin='round';ctx.stroke();
  rr(0,0,w,h,30);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(50,h-8);ctx.lineTo(12,h+38);ctx.lineTo(106,h-8);ctx.closePath();ctx.fill();
  lines.forEach((l,i)=>txt(l,35,19+size*.68+i*size*1.3,size,C.ink,{align:'left'}));
  ctx.restore();
}

/* ---------- kawaii face ---------- */
function face(x,y,s,o={}){
  const mood=o.mood||'happy', bl=o.blink??blinkAt(T,o.seed||0), ink=o.ink||C.ink;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineCap='round';ctx.lineJoin='round';
  for(const ex of [-20,20]){
    ctx.fillStyle=ink;ctx.strokeStyle=ink;ctx.lineWidth=5;
    if(mood==='sleep'||bl>.6){ctx.beginPath();ctx.arc(ex,-6,8,.15*Math.PI,.85*Math.PI);ctx.stroke();}
    else if(mood==='star'){starPath(ex,-5,12,5,.45);ctx.fill();}
    else{ctx.beginPath();ctx.ellipse(ex,-4,7.5,Math.max(.5,10*(1-bl)),0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+2.6,-8,3,0,Math.PI*2);ctx.fill();}
  }
  ctx.fillStyle='rgba(255,110,160,.5)';
  ctx.beginPath();ctx.ellipse(-34,10,10,6,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(34,10,10,6,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineWidth=4.5;
  if(o.sing){ctx.beginPath();ctx.ellipse(0,13,7,4+7*o.sing,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff7aa8';ctx.beginPath();ctx.ellipse(0,15+3*o.sing,4,2.5*o.sing,0,0,Math.PI*2);ctx.fill();}
  else if(mood==='sleep'){ctx.beginPath();ctx.arc(0,12,3.5,0,Math.PI*2);ctx.stroke();}
  else{ctx.beginPath();ctx.moveTo(-9,9);ctx.quadraticCurveTo(-4.5,17,0,10);ctx.quadraticCurveTo(4.5,17,9,9);ctx.stroke();}
  ctx.restore();
}

/* ---------- note character ---------- */
function drawNote(type,x,y,s,o={}){
  if(s<=0.001)return;
  const n=NOTES[type], col=o.col||n.col, sq=o.squash||0;
  ctx.save();ctx.translate(x,y);ctx.scale(s*(1+sq*.18),s*(1-sq*.18));
  ctx.lineCap='round';ctx.lineJoin='round';
  const sx=50, top=-235;
  if(n.stem){
    ctx.strokeStyle=C.ink;ctx.lineWidth=12;line(sx,-8,sx,top);
    const fk=o.flagK??1;
    for(let i=0;i<n.flags&&fk>.01;i++){
      ctx.save();ctx.translate(sx,top+i*50);ctx.rotate(Math.sin(T*6+i)*.07);ctx.scale(fk,fk);
      ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(10,40,82,52,70,122);ctx.bezierCurveTo(62,86,30,72,0,62);ctx.closePath();
      ctx.fillStyle=col;ctx.fill();ctx.lineWidth=9;ctx.strokeStyle=C.ink;ctx.stroke();ctx.restore();
    }
  }
  if(o.feet!==false){ctx.fillStyle=C.ink;for(const fx of [-24,24]){ctx.beginPath();ctx.ellipse(fx,46,15,9,0,0,Math.PI*2);ctx.fill();}}
  ctx.save();ctx.rotate(-.32);ctx.beginPath();ctx.ellipse(0,0,64,46,0,0,Math.PI*2);
  ctx.fillStyle=n.filled?col:'#fff';ctx.fill();
  if(!n.filled){ctx.save();ctx.clip();ctx.lineWidth=28;ctx.strokeStyle=col;ctx.stroke();ctx.restore();}
  ctx.lineWidth=10;ctx.strokeStyle=C.ink;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(-30,-22,13,6,-.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
  if(o.face!==false) face(2,4,1,o);
  if(o.dot){circle(104,-4,16,C.ink);circle(99,-9,4.5,'#fff');}
  ctx.restore();
}
/* ---------- rest characters ---------- */
function drawRest(type,x,y,s,o={}){
  if(s<=0.001)return;
  const col=o.col||NOTES[type].col, fc=o.face!==false;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineJoin='round';ctx.lineCap='round';
  if(type==='w'||type==='h'){
    ctx.strokeStyle=C.ink;ctx.lineWidth=8;line(-115,0,115,0);
    const by=type==='w'?0:-58; blob(-62,by,124,58,14,col,C.ink,8,false);
    if(fc) face(0,by+31,.62,{mood:'sleep'});
  }else if(type==='q'){
    const p=()=>{ctx.beginPath();ctx.moveTo(-16,-112);ctx.lineTo(24,-64);ctx.lineTo(-14,-22);ctx.lineTo(26,22);ctx.quadraticCurveTo(-34,4,-4,64);};
    p();ctx.strokeStyle=C.ink;ctx.lineWidth=36;ctx.stroke();p();ctx.strokeStyle=col;ctx.lineWidth=21;ctx.stroke();
    if(fc){circle(4,-44,26,col);face(4,-42,.5,{mood:'sleep'});}
  }else{
    const two=type==='s';
    ctx.strokeStyle=C.ink;ctx.lineWidth=14;line(two?44:36,two?-112:-88,two?-12:-4,two?96:78);
    const blobs=two?[[-26,-92,44,-112],[-38,-36,30,-56]]:[[-22,-74,36,-88]];
    blobs.forEach(([bx,by,tx,ty])=>{ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(bx+10,by+12);ctx.quadraticCurveTo(tx-20,by+30,tx,ty);ctx.stroke();
      circle(bx,by,27,col,C.ink,7); if(fc) face(bx,by+2,.5,{mood:'sleep'});});
  }
  ctx.restore();
}
function zzz(x,y,t){for(let i=0;i<3;i++){const p=fr(t*.45+i/3);txt('z',x+p*46,y-p*100,26+p*26,C.lav,{weight:900,alpha:Math.sin(p*Math.PI),stroke:'#fff',lw:6});}}

/* ---------- fx ---------- */
const CONF=[C.pink,C.butter,C.mint,C.sky,C.lav,C.peach];
function burst(lt,at,x,y,n,seed,spread=1){
  const tau=lt-at; if(tau<0||tau>1.4)return;
  for(let i=0;i<n;i++){const a=R(seed+i)*Math.PI*2, sp=(280+R(seed+i*1.7)*620)*spread, d=sp*tau*(1-tau*.35);
    const px=x+Math.cos(a)*d, py=y+Math.sin(a)*d+420*tau*tau, sz=(10+R(seed+i*3.1)*16)*(1-tau/1.4);
    ctx.save();ctx.translate(px,py);ctx.rotate(tau*6*(R(seed+i)-.5)*4);ctx.fillStyle=CONF[i%6];ctx.strokeStyle=C.ink;ctx.lineWidth=3;
    if(i%3===0){starPath(0,0,sz,5,.5);}else if(i%3===1){heartPath(0,0,sz*.7);}else{ctx.beginPath();ctx.arc(0,0,sz*.6,0,Math.PI*2);}
    ctx.fill();ctx.stroke();ctx.restore();}
}
function rays(x,y,t,a){if(a<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(t*.15);ctx.fillStyle=`rgba(255,255,255,${a})`;
  for(let i=0;i<16;i+=2){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,2400,i*Math.PI/8,(i+1)*Math.PI/8);ctx.closePath();ctx.fill();}ctx.restore();}
const DOOD=Array.from({length:26},(_,i)=>({x:R(i)*W,y:R(i+50)*H,s:18+R(i+90)*34,k:i%5,sp:.3+R(i+7)*.8,rot:R(i+3)*6}));
function bg(c,t){
  const g=ctx.createLinearGradient(0,0,W*.35,H);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.38)';const sp=90,off=(t*18)%sp;
  ctx.beginPath();
  for(let r=-1;r<H/sp+2;r++)for(let q=-1;q<W/sp+2;q++){const x=q*sp+off+(r%2?sp/2:0),y=r*sp+off;ctx.moveTo(x+6.5,y);ctx.arc(x,y,6.5,0,Math.PI*2);}
  ctx.fill();
  DOOD.forEach(d=>{const x=(d.x+t*22*d.sp)%(W+120)-60, y=d.y+Math.sin(t*d.sp+d.rot)*22;
    ctx.save();ctx.translate(x,y);ctx.rotate(d.rot+t*.3*d.sp);ctx.globalAlpha=.6;ctx.fillStyle='#fff';
    if(d.k===0){starPath(0,0,d.s*.6,5,.5);ctx.fill();}else if(d.k===1){heartPath(0,0,d.s*.5);ctx.fill();}
    else if(d.k===2){txt('♪',0,0,d.s*1.5,'#fff',{weight:900});}else if(d.k===3){starPath(0,0,d.s*.65,4,.28);ctx.fill();}
    else{ctx.beginPath();ctx.arc(0,0,d.s*.25,0,Math.PI*2);ctx.fill();}ctx.restore();});
}
function pizza(x,y,r,sl,col,pop){
  if(r<=1)return; ctx.save();ctx.translate(x,y);circle(0,14,r,'rgba(74,51,88,.14)');
  const order=[...Array(sl).keys()].reverse();
  order.forEach(i=>{const a0=-Math.PI/2+i*2*Math.PI/sl,a1=a0+2*Math.PI/sl,am=(a0+a1)/2,hi=i===0,off=hi&&sl>1?pop*r*.14:0;
    ctx.save();ctx.translate(Math.cos(am)*off,Math.sin(am)*off);ctx.beginPath();
    if(sl===1)ctx.arc(0,0,r,0,Math.PI*2);else{ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a1);ctx.closePath();}
    ctx.fillStyle=hi?col:'#fff1c9';ctx.fill();
    if(!hi&&sl<=8){for(const rf of [.45,.74]){circle(Math.cos(am)*r*rf,Math.sin(am)*r*rf,r*.065,'#ff9fa8');}}
    if(r>16){ctx.beginPath();ctx.arc(0,0,r-9,a0+.03,a1-.03);ctx.strokeStyle='#f3c07a';ctx.lineWidth=14;ctx.stroke();}
    ctx.beginPath();if(sl===1)ctx.arc(0,0,r,0,Math.PI*2);else{ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a1);ctx.closePath();}
    ctx.strokeStyle=C.ink;ctx.lineWidth=6;ctx.stroke();
    if(hi&&sl<=8){const fr2=sl===1?0:r*.6;face(Math.cos(am)*fr2,Math.sin(am)*fr2,sl===1?1.3:sl<=4?.9:.5,{seed:9});}
    ctx.restore();});
  ctx.restore();
}

  for(let i=0;i<4;i++){const cx=x0+cw*(i+.5),on=aB>=0&&Math.floor(aB)===i,gl=on?Math.exp(-fr(aB)*5):0;
    circle(cx,y-106,28+gl*9,on?C.butter:'#fff',C.ink,5);txt(String(i+1),cx,y-104,32,C.ink,{weight:900});}
  pat.forEach(p=>{const px=x0+p.b0*cw+7,pw=(p.b1-p.b0)*cw-14,on=aB>=p.b0&&aB<p.b1,bump=on?Math.exp(-(aB-p.b0)*BEAT*9):0;
    ctx.save();ctx.translate(0,-bump*12);

    if(on){const q=(aB-p.b0)/(p.b1-p.b0);ctx.save();rr(px,y-36,pw,72,36);ctx.clip();ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(px,y-36,pw*q,72);ctx.restore();}

    if(pw>150)txt(sayFor(p),px+pw/2+22,y+2,34,C.ink,{weight:900});
    ctx.restore();});
  if(aB>=0){const hx=x0+aB*cw;ctx.strokeStyle=C.ink;ctx.lineWidth=6;ctx.lineCap='round';line(hx,y-70,hx,y+70);circle(hx,y-72,11,C.pink,C.ink,4);}
}
function demoState(s,lt){

}

gameB.onclick=()=>mode==='game'?exitGame():enterGame();
const evLag=e=>clamp((performance.now()-e.timeStamp)/1000,0,.1)||0;
function cvPos(e){const r=cv.getBoundingClientRect();MX=(e.clientX-r.left)/r.width*W;MY=(e.clientY-r.top)/r.height*H;}
cv.addEventListener('pointermove',cvPos);
cv.addEventListener('pointerdown',e=>{swallow=false;cvPos(e);const b=BTN.find(hit);
  if(b){e.preventDefault();swallow=true;audioInit();A.resume();b.fn();return;}
  if(mode==='game'&&G.scr==='play'){e.preventDefault();tap(evLag(e));}});
function gameKey(e){
  if(e.repeat)return;const k=e.code;
  if(k==='Escape'){e.preventDefault();if(G.scr==='play'){stopRun();go('ready');}else if(G.scr!=='menu')go('menu');else exitGame();return;}
  if(G.scr==='ready'&&(k==='ArrowLeft'||k==='ArrowRight'||k==='Minus'||k==='Equal')){e.preventDefault();stepBpm(k==='ArrowLeft'||k==='Minus'?-4:4);return;}
  if(G.scr==='play'){if(['Space','Enter','KeyJ','KeyF','KeyK','KeyD','ArrowDown','ArrowUp'].includes(k)){e.preventDefault();tap(evLag(e));}return;}
  if(k==='Space'||k==='Enter'){e.preventDefault();const p=BTN.find(b=>b.primary);if(p)p.fn();}
}
window.__game={G,LV,enterGame,go,startRun,tap,finish,gameRender,filmEnd};

const qs=new URLSearchParams(location.search);if(qs.has('game'))setTimeout(enterGame,0); /* link straight to the game with ?game */if(qs.has('t')){pos=clamp(+qs.get('t'),0,TOTAL);started=true;}
window.__render=t=>{started=true;render(t);};window.__TOTAL=TOTAL;
let lastErr=0;
function loop(){
  requestAnimationFrame(loop); /* schedule FIRST, so an error below can never stop the picture */
  let t=now();
  if(playing&&t>=TOTAL){pause();pos=TOTAL;t=TOTAL;if(recorder)setTimeout(()=>recorder&&recorder.stop(),300);}
  BTN=[];
  if(!window.__frozen){
    try{if(mode==='game')gameRender();else{render(clamp(t,0,TOTAL));filmEnd();}}
    catch(e){ /* reset canvas state (unbalanced save/restore) and keep going */
      try{for(let i=0;i<40;i++)ctx.restore();}catch(_){}
      ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.setLineDash([]);
      if(performance.now()-lastErr>2000){lastErr=performance.now();console.warn('frame error at',t.toFixed(2),e);}
    }
  }
  cv.style.cursor=(BTN.some(hit)||mode==='film'||G.scr==='play')?'pointer':'default';
  seek.value=Math.round(clamp(t/TOTAL)*1000);tm.textContent=fmt(clamp(t,0,TOTAL))+' / '+fmt(TOTAL);}
loop();
</script>
