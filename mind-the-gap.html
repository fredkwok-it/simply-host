:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #08090d; overflow: hidden; font-family: "Archivo", system-ui, sans-serif; color: #F1ECE2; }
#film { position: absolute; display: block; cursor: pointer; }
#poster { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 4vw 130px; background: linear-gradient(180deg, rgba(8,9,13,0) 50%, rgba(8,9,13,.55)); cursor: pointer; opacity: 0; transition: opacity .5s; }
#poster.ready { opacity: 1; }
#poster.gone { opacity: 0; pointer-events: none; }
#poster .go { display: flex; align-items: center; gap: 18px; background: #17171E; color: #F1ECE2; border-radius: 999px; padding: 14px 30px 14px 16px; box-shadow: 0 18px 50px rgba(0,0,0,.35); transition: transform .2s; }
#poster:hover .go { transform: translateY(-3px) scale(1.02); }
#poster .disc { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: #F5C518; color: #17171E; }
#poster .disc svg { width: 26px; height: 26px; margin-left: 4px; }
#poster b { display: block; font-weight: 800; font-size: 20px; letter-spacing: .01em; }
#poster small { display: block; font: 600 12px "JetBrains Mono", monospace; letter-spacing: .2em; opacity: .65; margin-top: 3px; text-transform: uppercase; }
#ctrl { position: fixed; left: 0; right: 0; bottom: 0; padding: 40px 28px 18px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.62)); display: flex; flex-direction: column; gap: 10px; transition: opacity .4s; }
body.idle #ctrl { opacity: 0; }
body.idle, body.idle #film { cursor: none; }
body:not(.playing) #ctrl { opacity: 1; }
#bar { position: relative; height: 18px; cursor: pointer; touch-action: none; }
#bar::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); }
#fill { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #2E4BD0, #E1303E, #EE8A17, #1E9B57); }
#knob { position: absolute; top: 2px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #F1ECE2; box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
.tick { position: absolute; top: 3px; width: 4px; height: 12px; margin-left: -2px; background: #F5C518; border-radius: 2px; opacity: .9; }
.tick:hover::after { content: attr(data-label); position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 11px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; background: #17171E; padding: 6px 10px; border-radius: 6px; }
#hover { position: absolute; bottom: 22px; transform: translateX(-50%); font: 600 11px "JetBrains Mono", monospace; background: rgba(23,23,30,.9); padding: 4px 7px; border-radius: 5px; opacity: 0; pointer-events: none; transition: opacity .15s; }
#bar:hover #hover { opacity: 1; }
#row { display: flex; align-items: center; gap: 14px; }
#row button { background: none; border: 0; color: #F1ECE2; width: 38px; height: 38px; padding: 7px; cursor: pointer; border-radius: 8px; }
#row button:hover { background: rgba(255,255,255,.1); }
#row svg { width: 100%; height: 100%; display: block; }
#time, #chap { font: 600 12px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
#chap { margin-left: 6px; opacity: .6; }
.sp { flex: 1; }
</style>
</head>

const inv = (a, b, x) => clamp((x - a) / (b - a));
const E_ = {
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  out5: t => 1 - Math.pow(1 - t, 5),
  in: t => t * t * t,
  sm: t => t * t * (3 - 2 * t),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  lin: t => t,
};
function rnd(i, s = 0) { const x = Math.sin(i * 127.1 + s * 311.7 + 0.123) * 43758.5453; return x - Math.floor(x); }
function noise1(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(rnd(i, s), rnd(i + 1, s), u) * 2 - 1; }

// ── palette
const HEX = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

};

  { id: 'c0a', text: 'Right now, deep inside your head, a tiny chemical is on the move.', extra: 1.2 },
  { id: 'c0b', text: 'Its name is dopamine.', term: 'Dopamine · C₈H₁₁NO₂', extra: 1.6 },

  { id: 'ch1', card: 1, dur: 3.6 },
  { id: 'm1', text: 'Your brain is made of billions of nerve cells. And here’s the surprise: they never quite touch.' },
  { id: 'm2', text: 'Between two cells there’s a tiny gap. To pass on a message, one cell sends chemicals across it.', term: 'Synapse', extra: 0.6 },

  { id: 'm4', text: '…and through a ticket gate on the other side. Click. Message delivered.', term: 'Receptor (D2)', extra: 1.2 },
  { id: 'm5', text: 'No passengers through the gates? No message gets through.', extra: 0.6 },

  { id: 'ch2', card: 2, dur: 3.6 },
  { id: 'p1', text: 'Dopamine doesn’t wander everywhere. It runs along a few main routes through the brain.', term: 'Dopamine pathways', extra: 0.8 },
  { id: 'p2', text: 'Straighten them out, the way a map designer would, and you get something familiar: a metro map.', extra: 1.4 },
  { id: 'p2b', text: 'Three lines start at a busy hub in the midbrain. The fourth starts nearby, in the hypothalamus.', term: 'Midbrain · Hypothalamus', extra: 0.6 },

  { id: 'l1b', text: 'It helps with thinking, planning, motivation and emotions — even your facial expressions.', line: 1, extra: 0.8 },
  { id: 'l2a', text: 'Line 2 runs to the brain’s reward centre.', term: 'Mesolimbic pathway', line: 2 },
  { id: 'l2b', text: 'It’s the “that was good — do it again!” line: pleasure, reward, and deciding what matters.', line: 2, extra: 0.8 },
  { id: 'l3a', text: 'Line 3 runs to the brain’s movement control centre.', term: 'Nigrostriatal pathway', line: 3 },
  { id: 'l3b', text: 'It keeps your movements smooth and coordinated: walking, writing, catching a ball.', line: 3, extra: 0.8 },
  { id: 'l4a', text: 'Line 4 is short: from the hypothalamus down to the pituitary gland.', term: 'Tuberoinfundibular pathway', line: 4 },
  { id: 'l4b', text: 'Here dopamine works like a hand on a tap. It keeps a hormone called prolactin turned down low.', term: 'Prolactin', line: 4, extra: 0.8 },

  for (let i = 1; i < k.length; i++) if (t < k[i][0]) {
    const a = k[i - 1], b = k[i], f = E_.io((t - a[0]) / (b[0] - a[0] || 1));
    // zoom interpolated in log space for natural feel
    return [lerp(a[1], b[1], f), lerp(a[2], b[2], f), Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), f))];
  }
  return k[k.length - 1].slice(1);
}
function applyCam(ctx, cam, shake = 0) {
  const [cx, cy, z] = cam;
  ctx.translate(W / 2 + shake * noise1(NOW * 9, 3), H / 2 + shake * noise1(NOW * 9, 7));
  ctx.scale(z, z); ctx.translate(-cx, -cy);
}

// ───────── map drawing
function drawBrain(ctx, th, alpha, drawOn = 1) {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // soft fill
  ctx.fillStyle = rgba(th.brainFill, 1);
  ctx.globalAlpha = alpha * drawOn;
  ctx.fill(BRAIN.stem); ctx.fill(BRAIN.cbl); ctx.fill(BRAIN.outline);
  ctx.globalAlpha = alpha;
  // folds
  ctx.save(); ctx.clip(BRAIN.outline);
  ctx.strokeStyle = rgba(th.ink, 0.13 * drawOn); ctx.lineWidth = 3; ctx.stroke(BRAIN.folds); ctx.stroke(BRAIN.cc);
  ctx.restore();
  ctx.save(); ctx.clip(BRAIN.cbl); ctx.strokeStyle = rgba(th.ink, 0.14 * drawOn); ctx.lineWidth = 2.5; ctx.stroke(BRAIN.cfold); ctx.restore();
  // outline draw-on
  ctx.strokeStyle = rgba(th.ink, 0.55); ctx.lineWidth = 3.2;
  const L = BRAIN.outLen; ctx.setLineDash([L * drawOn, L * 2]);
  ctx.stroke(BRAIN.outline); ctx.stroke(BRAIN.cbl); ctx.stroke(BRAIN.stem);
  ctx.setLineDash([]);
  ctx.restore();
}

function theme(n) {
  return {
    n, bg: mixc(C.paper, C.night, n), ink: mixc(C.ink, C.paper, n), paper: mixc(C.paper, C.night2, n),
    brainFill: mixc([234, 226, 212], [22, 23, 33], n),
    L: i => mixc(C.L[i], C.LN[i], n),
  };
}

function drawLines(ctx, th, z, k, reveal) {
  const lw = 15 / Math.pow(z, 0.45);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const i of [4, 3, 1, 2]) {
    const r = reveal[i]; if (r <= 0) continue;
    const a = lineAlpha(i);
    const [pts, cum] = linePts(i, k); const L = cum[cum.length - 1];
    const col = th.L(i);
    // ghost track
    ctx.beginPath(); polyPath(ctx, pts, cum, 0, L * r);
    if (th.n > 0.01) { ctx.strokeStyle = rgba(col, 0.16 * th.n * a); ctx.lineWidth = lw * 3.2; ctx.stroke(); }
    ctx.strokeStyle = rgba(col, a); ctx.lineWidth = lw; ctx.stroke();
    // inner highlight
    ctx.strokeStyle = rgba([255, 255, 255], 0.16 * a); ctx.lineWidth = lw * 0.28; ctx.stroke();
  }
}

function drawTrains(ctx, th, z, k, reveal) {
  const lw = 15 / Math.pow(z, 0.45);
  for (let i = 1; i <= 4; i++) {
    if (reveal[i] < 1) continue;
    const a = lineAlpha(i); const d = dens(i), g = gate(i);
    const [pts, cum] = linePts(i, k); const L = cum[cum.length - 1];
    const N = Math.max(4, Math.round(L / 34)), od = odo(i, NOW) / L;
    const col = th.L(i);
    const rush = i === 2 ? clamp((dens(2) - 0.5) * 2) : 0;
    for (let j = 0; j < N; j++) {
      const h = rnd(j, i * 13);
      const vis = clamp((d - h * 0.98) * 10); if (vis <= 0) continue;
      let s = ((j / N + od) % 1 + 1) % 1;
      s = lerp(s, 0.93 * (1 - (1 - s) * (1 - s)), g);
      const fadeEnds = clamp(s / 0.05) * clamp((1 - s) / 0.05 + g);
      const al = vis * fadeEnds * a; if (al <= 0.01) continue;
      const [x, y, ang] = polyAt(pts, cum, s * L);
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
      const len = lw * (1.9 + rush * 0.8), wid = lw * 0.62;
      // glow (night only)
      if (th.n > 0.02) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = rgba(col, (0.22 + rush * 0.2) * al * th.n);
        rr(ctx, -len * 1.1, -wid * 1.25, len * 2.2, wid * 2.5, wid * 1.25); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.fillStyle = rgba([255, 255, 255], al);
      rr(ctx, -len / 2, -wid / 2, len, wid, wid / 2); ctx.fill();
      if (th.n < 0.98) { ctx.strokeStyle = rgba(mixc(col, [0, 0, 0], 0.35), al * (1 - th.n) * 0.9); ctx.lineWidth = wid * 0.18; ctx.stroke(); }
      ctx.fillStyle = rgba(col, al * 0.9); ctx.beginPath(); ctx.arc(len / 2 - wid / 2, 0, wid * 0.28, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

const STATION_LABELS = [
  ['PFC', 'PREFRONTAL CORTEX', 0, -34, 'center', 1],
  ['NAC', 'NUCLEUS ACCUMBENS', -10, 44, 'center', 2],
  ['STR', 'STRIATUM', 0, -32, 'center', 3],
  ['HYP', 'HYPOTHALAMUS', -34, 6, 'right', 4],
  ['PIT', 'PITUITARY', -34, 6, 'right', 4],
];
function drawStations(ctx, th, z, alpha) {
  if (alpha <= 0.01) return;
  const r = 12 / Math.pow(z, 0.45), sw = 5 / Math.pow(z, 0.45);
  ctx.save(); ctx.globalAlpha = alpha;
  // midbrain interchange capsule
  ctx.fillStyle = rgba(th.paper); ctx.strokeStyle = rgba(th.ink); ctx.lineWidth = sw;
  const [x1, y1] = ST.VTA, [x2] = ST.SN;
  rr(ctx, x1 - r * 1.25, y1 - r * 1.6, (x2 - x1) + r * 2.5, r * 3.2, r * 1.6); ctx.fill(); ctx.stroke();
  for (const id of ['PFC', 'NAC', 'STR', 'HYP', 'PIT']) {
    const [x, y] = ST[id]; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  }
  // labels
  const fs = 17 / Math.pow(z, 0.6);
  ctx.font = font(600, fs, FM);
  for (const [id, label, dx, dy, al, li] of STATION_LABELS) {
    const la = lerp(0.35, 1, lineAlpha(li));
    ctx.fillStyle = rgba(th.ink, 0.9 * la);
    trackText(ctx, label, ST[id][0] + dx / Math.pow(z, 0.5), ST[id][1] + dy / Math.pow(z, 0.5), fs * 0.12, al);
  }
  ctx.fillStyle = rgba(th.ink, 0.9 * lerp(0.4, 1, 1 - anyFocus()));
  trackText(ctx, 'MIDBRAIN', (x1 + x2) / 2, y1 + 42 / Math.pow(z, 0.5), fs * 0.12, 'center');
  ctx.restore();
}
function bullet(ctx, x, y, r, i, th, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.fillStyle = rgba(th ? th.L(i) : C.L[i]); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = font(800, r * 1.25); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(i), x, y + r * 0.06); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.restore();
}
function drawBullets(ctx, th, z, alpha) {
  if (alpha <= 0.01) return;
  const r = 15 / Math.pow(z, 0.5);
  const spots = { 1: [ST.PFC[0] - 46, ST.PFC[1]], 2: [ST.NAC[0] - 44, ST.NAC[1]], 3: [ST.STR[0] - 44, ST.STR[1]], 4: [ST.PIT[0], ST.PIT[1] + 44] };
  for (let i = 1; i <= 4; i++) {
    const [x, y] = spots[i]; const sx = ST[{ 1: 'PFC', 2: 'NAC', 3: 'STR', 4: 'PIT' }[i]];
    const fx = sx[0] + (x - sx[0]) / Math.pow(z, 0.5), fy = sx[1] + (y - sx[1]) / Math.pow(z, 0.5);
    bullet(ctx, fx, fy, r, i, th, alpha * lerp(0.3, 1, lineAlpha(i)));
  }
}
// barrier gates at terminals
function drawGates(ctx, th, z) {
  const term = { 1: ['PFC', 3], 2: ['NAC', 3], 3: ['STR', 3], 4: ['PIT', 1] };
  for (let i = 1; i <= 4; i++) {
    const g = gate(i); if (g <= 0.01) continue;
    const [pts, cum] = linePts(i, 1); const L = cum[cum.length - 1];
    const [x, y, ang] = polyAt(pts, cum, L - 34 / Math.pow(z, 0.3));
    const s = E_.back(clamp(g * 1.4)) * (1 / Math.pow(z, 0.45));
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2); ctx.scale(s, s);
    ctx.globalAlpha = clamp(g * 3) * lerp(0.4, 1, lineAlpha(i));
    const w = 64, h = 16;
    ctx.fillStyle = '#17171E'; rr(ctx, -w / 2 - 3, -h / 2 - 3, w + 6, h + 6, 6); ctx.fill();
    ctx.save(); rr(ctx, -w / 2, -h / 2, w, h, 4); ctx.clip();
    ctx.fillStyle = rgba(C.gap); ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.fillStyle = '#17171E';
    for (let k = -6; k < 8; k++) { ctx.beginPath(); ctx.moveTo(k * 12, -h / 2); ctx.lineTo(k * 12 + 6, -h / 2); ctx.lineTo(k * 12 - 4, h / 2); ctx.lineTo(k * 12 - 10, h / 2); ctx.fill(); }
    ctx.restore(); ctx.restore();
  }
}

// ───────────────────────── animated pictograms ─────────────────────────
// all drawn centred on (0,0); caller translates/scales

function icoFace(ctx, t, ink, col, flat = 0, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const live = 1 - flat;
  const expr = live * (0.55 + 0.45 * Math.sin(t * 1.4));         // smile amount
  const brow = live * (Math.max(0, Math.sin(t * 0.9 + 1)) * 12);
  const blink = (t % 3.3) < 0.13 ? 0.1 : 1;
  // head
  ctx.fillStyle = rgba(mixc(col, [255, 255, 255], 0.82 + flat * 0.1)); ctx.beginPath(); ctx.arc(0, 10, 112, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(mixc(ink, [150, 150, 150], flat * 0.5)); ctx.lineWidth = 10; ctx.stroke();
  // eyes
  ctx.fillStyle = rgba(ink);
  for (const sx of [-40, 40]) {
    ctx.save(); ctx.translate(sx, -8);
    const lid = lerp(1, 0.38, flat) * blink;
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 15 * lid, 0, 0, TAU); ctx.fill();
    ctx.restore();
    // brows
    ctx.beginPath(); ctx.moveTo(sx - 18, -40 - brow + (flat * 6)); ctx.lineTo(sx + 18, -42 - brow * (sx > 0 ? 1.2 : 0.8) + flat * 6);
    ctx.lineWidth = 8; ctx.stroke();
  }
  // mouth
  ctx.beginPath(); ctx.moveTo(-42, 50); ctx.quadraticCurveTo(0, 50 + expr * 46, 42, 50); ctx.lineWidth = 10; ctx.stroke();
  // thought spark (planning / ideas)
  if (live > 0.05) {
    const p = 0.5 + 0.5 * Math.sin(t * 3);
    ctx.save(); ctx.translate(122, -118); ctx.globalAlpha *= live;
    ctx.fillStyle = rgba(C.gap, 0.25 + 0.35 * p); ctx.beginPath(); ctx.arc(0, 0, 34 + p * 6, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(C.gap); ctx.beginPath(); ctx.arc(0, -4, 18, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(ink); ctx.fillRect(-8, 14, 16, 8);
    ctx.strokeStyle = rgba(ink); ctx.lineWidth = 4;
    for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + (k - 2) * 0.55; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 28, -4 + Math.sin(a) * 28); ctx.lineTo(Math.cos(a) * (38 + p * 6), -4 + Math.sin(a) * (38 + p * 6)); ctx.stroke(); }
    ctx.restore();
  }
  ctx.restore();
}

function starPath(ctx, r1, r2, n = 5) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, r = i % 2 ? r2 : r1; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath();
}
function icoStar(ctx, t, ink, col, rush = 0, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.lineCap = 'round';
  const beat = Math.pow(Math.max(0, Math.sin(t * (2.2 + rush * 5))), 6);
  // rays
  const nr = 16;
  for (let i = 0; i < nr; i++) {
    const a = i / nr * TAU + t * 0.2 + (rush ? noise1(t * 6 + i, 4) * 0.2 * rush : 0);
    const r0 = 128 + beat * 8, r1 = 150 + beat * 26 + (i % 2) * 18 + rush * 40 * rnd(i + Math.floor(t * 12));
    ctx.strokeStyle = rgba(col, 0.5 + 0.5 * beat); ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.stroke();
  }
  ctx.save(); ctx.rotate(Math.sin(t * 0.8) * 0.12 + rush * noise1(t * 8, 1) * 0.3); ctx.scale(1 + beat * 0.08, 1 + beat * 0.08);
  ctx.fillStyle = rgba(col); starPath(ctx, 110, 48); ctx.fill();
  ctx.strokeStyle = rgba(ink); ctx.lineWidth = 8; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
  // +1s
  ctx.font = font(900, 40); ctx.textAlign = 'center';
  const rate = 1 + rush * 5;
  for (let k = 0; k < 2 + rush * 8; k++) {
    const ph = (t * rate * 0.5 + k / (2 + rush * 8)) % 1, id = Math.floor(t * rate * 0.5 + k / (2 + rush * 8)) * 7 + k;
    const x = (rnd(id, 2) - 0.5) * 260, y = -100 - ph * 120 + (rnd(id, 5) - 0.5) * 80;
    ctx.fillStyle = rgba(rush > 0.3 ? C.gap : ink, Math.sin(ph * Math.PI));
    ctx.fillText(rush > 0.3 ? (rnd(id, 9) < .5 ? '!' : '!!') : '+1', x, y);
  }
  ctx.textAlign = 'left';
  ctx.restore();
}

function icoWalker(ctx, t, ink, col, stiff = 0, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const A = lerp(1, 0.12, stiff), ph = t * TAU * lerp(0.9, 0.35, stiff);
  const trem = stiff * Math.sin(t * 55) * 5;
  // ground
  ctx.strokeStyle = rgba(ink, 0.35); ctx.lineWidth = 5;
  const off = (t * lerp(140, 18, stiff)) % 60;
  for (let x = -180 - off; x < 180; x += 60) { ctx.beginPath(); ctx.moveTo(Math.max(-150, x), 150); ctx.lineTo(Math.min(150, x + 30), 150); if (x + 30 > -150) ctx.stroke(); }
  const bob = Math.abs(Math.sin(ph)) * 8 * A;
  ctx.translate(0, -bob);
  ctx.rotate(stiff * 0.06 * Math.sin(t * 0.7));
  const hip = [0, 30], neck = [6, -64];
  ctx.strokeStyle = rgba(ink); ctx.lineWidth = 26;
  const limb = (o, ang1, ang2, l1, l2, jitter = 0) => {
    const k = [o[0] + Math.sin(ang1) * l1, o[1] + Math.cos(ang1) * l1];
    const e = [k[0] + Math.sin(ang1 + ang2) * l2 + jitter, k[1] + Math.cos(ang1 + ang2) * l2];
    ctx.beginPath(); ctx.moveTo(o[0], o[1]); ctx.lineTo(k[0], k[1]); ctx.lineTo(e[0], e[1]); ctx.stroke();
  };
  // back limbs lighter
  ctx.strokeStyle = rgba(mixc(ink, [255, 255, 255], 0.45));
  limb(hip, Math.sin(ph + Math.PI) * 0.55 * A, -Math.max(0, Math.sin(ph + Math.PI + 1)) * 0.7 * A, 62, 62);
  limb([4, -52], -Math.sin(ph + Math.PI) * 0.6 * A, 0.5 * A + stiff * 0.9, 50, 46, -trem);
  ctx.strokeStyle = rgba(ink);
  ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(neck[0], neck[1]); ctx.stroke();
  limb(hip, Math.sin(ph) * 0.55 * A, -Math.max(0, Math.sin(ph + 1)) * 0.7 * A, 62, 62);
  limb([4, -52], -Math.sin(ph) * 0.6 * A, 0.5 * A + stiff * 0.9, 50, 46, trem);
  ctx.fillStyle = rgba(ink); ctx.beginPath(); ctx.arc(12 + stiff * 4, -112, 25, 0, TAU); ctx.fill();
  // tremor marks
  if (stiff > 0.2) {
    ctx.strokeStyle = rgba(col, stiff); ctx.lineWidth = 5;
    for (const s of [-1, 1]) for (let k = 0; k < 2; k++) {
      ctx.beginPath(); ctx.arc(60, 24, 30 + k * 16, s > 0 ? -0.5 : Math.PI - 0.5, s > 0 ? 0.5 : Math.PI + 0.5); ctx.stroke();
    }
  }
  ctx.restore();
}

function hexagon(ctx, r) { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); }

function icoTap(ctx, t, ink, col, open = 0, alpha = 1, level = 0) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = rgba(ink); ctx.lineWidth = 9; ctx.fillStyle = rgba(mixc(ink, [255, 255, 255], 0.85));
  // pipe + spout
  ctx.beginPath(); ctx.moveTo(-170, -70); ctx.lineTo(10, -70); ctx.quadraticCurveTo(60, -70, 60, -20); ctx.lineTo(60, 0);
  ctx.lineTo(30, 0); ctx.lineTo(30, -20); ctx.quadraticCurveTo(30, -40, 10, -40); ctx.lineTo(-170, -40); ctx.closePath(); ctx.fill(); ctx.stroke();
  // valve stem + wheel
  ctx.beginPath(); ctx.moveTo(-40, -70); ctx.lineTo(-40, -110); ctx.stroke();
  ctx.save(); ctx.translate(-40, -118); ctx.rotate(open * 4.2);
  ctx.beginPath(); ctx.ellipse(0, 0, 54, 14, 0, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-54, 0); ctx.lineTo(54, 0); ctx.stroke();
  ctx.restore();
  // the dopamine "hand" holding the valve shut
  const hold = 1 - open;
  ctx.save(); ctx.translate(-40 + open * 120, -168 - open * 70); ctx.globalAlpha *= clamp(hold * 1.4);
  ctx.fillStyle = rgba(col); hexagon(ctx, 30); ctx.fill(); ctx.strokeStyle = rgba(ink); ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = font(800, 22); ctx.textAlign = 'center'; ctx.fillText('DA', 0, 8); ctx.textAlign = 'left';
  ctx.restore();
  // beaker
  const bx = 45, by = 70, bw = 120, bh = 120;
  ctx.save(); ctx.beginPath(); ctx.rect(bx - bw / 2, by, bw, bh); ctx.clip();
  const lev = clamp(level);
  ctx.fillStyle = rgba(col, 0.85); ctx.fillRect(bx - bw / 2, by + bh * (1 - 0.08 - lev * 0.8) + Math.sin(t * 6) * 2, bw, bh);
  ctx.restore();
  ctx.strokeStyle = rgba(ink); ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(bx - bw / 2, by); ctx.lineTo(bx - bw / 2, by + bh); ctx.lineTo(bx + bw / 2, by + bh); ctx.lineTo(bx + bw / 2, by); ctx.stroke();
  ctx.fillStyle = rgba(ink); ctx.font = font(700, 15, FM); trackText(ctx, 'PROLACTIN', bx, by + bh + 30, 2, 'center');
  // water
  ctx.fillStyle = rgba(col, 0.9);
  if (open > 0.05) {
    const w = 6 + open * 14;
    ctx.beginPath(); ctx.moveTo(45 - w / 2, 0); ctx.lineTo(45 + w / 2, 0); ctx.lineTo(45 + w / 2 + Math.sin(t * 20) * 2, by + bh * (1 - 0.08 - lev * 0.8)); ctx.lineTo(45 - w / 2, by + bh * (1 - 0.08 - lev * 0.8)); ctx.fill();
  } else {
    const ph = (t * 0.55) % 1;
    ctx.beginPath(); ctx.arc(45, 8 + ph * 150, 7 * (1 - ph * 0.3), 0, TAU); ctx.globalAlpha *= (1 - ph); ctx.fill();
  }
  ctx.restore();
}

function icoPill(ctx, t, ink, rot = -0.6, split = 0, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.rotate(rot);
  const w = 260, h = 104;
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(side * split * 40, side * split * 12);
    ctx.beginPath();
    if (side < 0) { ctx.moveTo(0, -h / 2); ctx.lineTo(-w / 2 + h / 2, -h / 2); ctx.arc(-w / 2 + h / 2, 0, h / 2, -Math.PI / 2, Math.PI / 2, true); ctx.lineTo(0, h / 2); }
    else { ctx.moveTo(0, -h / 2); ctx.lineTo(w / 2 - h / 2, -h / 2); ctx.arc(w / 2 - h / 2, 0, h / 2, -Math.PI / 2, Math.PI / 2); ctx.lineTo(0, h / 2); }
    ctx.closePath();
    ctx.fillStyle = side < 0 ? '#F1ECE2' : '#3A3F55'; ctx.fill();
    ctx.strokeStyle = rgba(ink); ctx.lineWidth = 9; ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(ctx, -w / 2 + 34, -h / 2 + 18, w * 0.38, 14, 7); ctx.fill();
  ctx.restore();
}

// the dopamine molecule, drawn bond by bond (p: 0→1)
const MOLE = (() => {
  const R = 64, v = []; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; v.push([Math.cos(a) * R, Math.sin(a) * R]); }
  const segs = [];
  for (let i = 0; i < 6; i++) segs.push({ a: v[i], b: v[(i + 1) % 6], dbl: i % 2 === 0 });
  // chain from vertex 0 (right)
  const c1 = [R + 56, -32], c2 = [R + 112, 0], n = [R + 168, -32];
  segs.push({ a: v[0], b: c1 }, { a: c1, b: c2 }, { a: c2, b: n, lab: ['NH₂', n[0] + 40, n[1] - 4] });
  // OH groups on vertices 3 (left) and 4 (upper-left)
  const o1 = [v[3][0] - 64, v[3][1]], o2 = [v[4][0] - 34, v[4][1] - 54];
  segs.push({ a: v[3], b: o1, lab: ['HO', o1[0] - 34, o1[1] + 4] }, { a: v[4], b: o2, lab: ['HO', o2[0] - 22, o2[1] - 20] });
  return { segs };
})();
function icoMolecule(ctx, p, ink, col, glow = 0) {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const n = MOLE.segs.length;
  ctx.font = font(700, 36, FM); ctx.textBaseline = 'middle';

}
function vNoise(t, dur, type, f0, f1, peak, q = 1, wet = 0.1, a = 0.002) {
  const ctx = AU.ctx, src = ctx.createBufferSource(); src.buffer = AU.noise; src.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type = type; bp.Q.value = q; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); src.start(t, Math.random()); src.stop(t + dur + 0.05); out(g, 1, wet);
}
function vWhoosh(t, dur = 0.9, peak = 0.05) {
  const ctx = AU.ctx, src = ctx.createBufferSource(); src.buffer = AU.noise; src.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4; bp.frequency.setValueAtTime(280, t); bp.frequency.exponentialRampToValueAtTime(2600, t + dur * 0.6); bp.frequency.exponentialRampToValueAtTime(900, t + dur);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + dur * 0.55); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); src.start(t, Math.random()); src.stop(t + dur + 0.05); out(g, 1, 0.4);
}
function vClick(t, f = 1800, lvl = 0.03) { const g = AU.ctx.createGain(); env(g, t, 0.001, lvl, 0.05); osc('sine', f, t, t + 0.08).connect(g); out(g, 1, 0.2); }
function vClunk(t) { vKick(t, 0.6); vNoise(t, 0.08, 'lowpass', 1800, 400, 0.12, 0.7, 0.1); vClick(t + 0.02, 900, 0.05); }
function vFlap(t, dur = 0.7, n = 18, lvl = 0.05) { for (let i = 0; i < n; i++) { const tt = t + (i / n) * dur + Math.random() * 0.01; vNoise(tt, 0.018, 'bandpass', 2600 + Math.random() * 1500, 2000, lvl * (0.5 + Math.random() * 0.5), 2, 0.05); } }
function vPop(t) { const g = AU.ctx.createGain(); env(g, t, 0.002, 0.08, 0.15); const o = osc('sine', 500, t, t + 0.2); o.frequency.exponentialRampToValueAtTime(1300, t + 0.08); o.connect(g); out(g, 1, 0.3); }
function vRiser(t, dur) { vNoise(t, dur, 'bandpass', 200, 5000, 0.035, 1.5, 0.5, dur * 0.95); }
function vScribble(t, dur) { for (let i = 0; i < dur * 14; i++) vNoise(t + i / 14 + Math.random() * 0.03, 0.05 + Math.random() * 0.04, 'bandpass', 3000 + Math.random() * 2000, 2500, 0.03, 3, 0.05, 0.01); }
function vHiss(t, dur) { vNoise(t, dur, 'bandpass', 900, 1600, 0.05, 0.8, 0.3, dur * 0.4); }

function music(a, b) {
  for (let k = Math.ceil(a / EIGHTH - 1e-6); k * EIGHTH < b; k++) {
    const ft = k * EIGHTH; if (ft >= TOTAL) break;
    const t = toCtx(ft); if (t < AU.ctx.currentTime - 0.01) continue;
    const barI = Math.floor(ft / BAR + 1e-6), pos = k % 8, md = moodAt(barI * BAR);
    const prog = PROG[md], ch = prog[barI % prog.length], r = rnd(k, 5);
    if (pos === 0) {
      if (md === 'open') { if (barI % 2 === 0) vPad(ch, t, BAR * 2, md); }
      else if (md === 'end') { if (ft >= B('end') && ft < B('end') + BAR) vPad(ch, t, 6.5, md, 1.2); }
      else vPad(ch, t, BAR, md);
    }
    if (md === 'open') {
      if ((pos === 0 || pos === 4) && ft > 0.5) { vKick(t, 0.32); vKick(t + 0.2, 0.2); }
      if (pos === 6 && barI % 2 === 1) vBell(ch[3] + 12, t, 0.35);
    } else if (md === 'bright') {
      const pat = [0, 2, 1, 3, 2, 4, 3, 1];
      if (r < 0.72) vMarimba(ch[pat[pos] % ch.length] + 12, t, 0.45 + 0.4 * rnd(k, 6));
      if (pos === 0 || pos === 5) vBass(ch[0] - 12, t, 0.9, 0.7);
    } else if (md === 'rush') {
      vBass(ch[0] - 12, t, 0.3, pos % 2 ? 0.55 : 0.9, 'sawtooth');
      if (pos % 2 === 0) vKick(t, 0.55);
      for (const h of [0, EIGHTH / 2]) vNoise(t + h, 0.04, 'highpass', 7000, 9000, h ? 0.012 : 0.02, 0.7, 0.02);
      if (r < 0.6) vMarimba(ch[(pos * 3) % ch.length] + 24, t, 0.35, 0.5);
    } else if (md === 'hollow') {
      if (pos === 0 && barI % 2 === 0) vBell(ch[ch.length - 1] + 12, t, 0.25, 0.8);
      if (pos === 4 && r < 0.5) vMarimba(ch[1] + 12, t, 0.25, 0.7);
    } else if (md === 'tense') {
      if (pos % 2 === 0) vBass(ch[0] - 12, t, 0.5, 0.6);
      if (pos === 0) vKick(t, 0.3);
      if (r < 0.3) vMarimba(ch[pos % ch.length] + 12, t, 0.3, 0.6);
    } else if (md === 'soft') {
      if (r < 0.42) vMarimba(ch[(pos * 2) % ch.length] + 12, t, 0.35, 0.5);
      if (pos === 0) vBass(ch[0] - 12, t, 1.2, 0.55);
    }
  }
}

// ── SFX cue sheet
const SFX = [];
function buildSfx() {
  const add = (t, type, a = {}) => SFX.push({ t, type, ...a });
  for (const x of TRANS) add(x.t - 0.45, 'whoosh', { d: 0.95 });
  for (const b of SCRIPT) if (b.card) add(b.s + 0.45, 'chime', { notes: [nm('A5'), nm('F#5'), nm('D5')] });
  // cold open
  for (let i = 0; i < 11; i++) add(B('c0b') + 0.1 + i * 0.2, 'tick', { f: 1400 + i * 60 });
  add(B('c0c') + 1.2, 'whoosh', { d: 1.4 });
  add(B('c0c') + 0.6, 'riser', { d: Ee('c0c') - B('c0c') - 0.4 });
  add(B('title') + 0.3, 'chime', { notes: [nm('D5'), nm('F#5'), nm('A5'), nm('D6')], big: 1 });
  add(B('title') + 0.3, 'kick');
  // synapse
  add(B('m2'), 'whoosh', { d: 1.8 });
  for (const w of synWindows()) for (let k = 0; ; k++) { const p = synPass(w, k); if (p.tk > w.e) break; add(p.ta, w.blocked ? 'bounce' : 'click', { j: p.j }); }
  for (let j = 0; j < 5; j++) add(B('g2') + 0.1 + j * 0.1 + 0.25, 'clunk');
  // map
  for (let i = 1; i <= 4; i++) add(B('p1') + 0.8 + (i - 1) * 0.5, 'bell', { m: [nm('D5'), nm('A4'), nm('F#5'), nm('E5')][i - 1], v: 0.4 });
  for (let i = 0; i < 8; i++) add(B('p2') + 0.8 + i * 0.3, 'tick', { f: 900 + i * 110 });
  add(B('p2') + 2.6, 'chime', { notes: [nm('D5'), nm('A5')] });
  for (let i = 1; i <= 4; i++) { add(B(`l${i}a`) + 0.5, 'chime', { notes: [[nm('E5'), nm('C#5')], [nm('F#5'), nm('D5')], [nm('A5'), nm('E5')], [nm('D6'), nm('A5')]][i - 1] }); add(B(`l${i}a`), 'whoosh', { d: 1.4 }); }
  for (let i = 1; i <= 4; i++) for (let c = 0; c < 4; c++) add(B(`l${i}b`) + 0.3 + c * 0.16, 'pop');
  add(B('h3') + 0.2, 'riser', { d: 2.2 }); add(B('h3') + 2.4, 'kick');
  add(B('h4') + 0.2, 'chime', { notes: [nm('E5'), nm('C5')] });
  for (let i = 0; i < 6; i++) add(B('h4') + 0.9 + i * 0.22, 'pop');
  const boardSfx = (id, rows, st = 0.32, off = 0.3) => { for (let i = 0; i < rows; i++) add(B(id) + off + 0.5 + i * st, 'flap', { d: 0.6 }); };
  boardSfx('h5', 5); boardSfx('h8', 3, 0.5); boardSfx('s2', 5, 0.55, 0.2); boardSfx('s4', 4, 0.6, 0.2);
  add(B('h6') + 0.6, 'stamp'); add(B('h9') + 0.6, 'stamp');
  for (const id of ['h7', 'h3', 'g3', 'g5', 's1', 's3', 's5', 'b2']) add(B(id) + 1.2, 'flap', { d: 0.4, small: 1 });
  add(B('g1') + 0.35, 'pop'); add(B('g3') + 0.6, 'clunk'); add(B('g3') + 2.0, 'chime', { notes: [nm('D5'), nm('A5'), nm('F#5')] });
  add(B('g5') + 0.2, 'whoosh', { d: 2.2 });
  for (const a of [1.4, 2.0, 2.6]) add(B('g5') + a, 'clunk');
  add(B('s3') + 1.2, 'hiss', { d: 4 });
  add(B('b4') + 0.8, 'scribble', { d: 3 });
  add(B('end') + 0.6, 'chime', { notes: [nm('D5'), nm('F#5'), nm('A5'), nm('D6')], big: 1 }); add(B('end') + 0.6, 'kick');
  SFX.sort((a, b) => a.t - b.t);
}
function playSfx(e) {
  const t = toCtx(e.t); if (t < AU.ctx.currentTime - 0.02) return;
  switch (e.type) {
    case 'whoosh': vWhoosh(t, e.d || 0.9); break;
    case 'chime': e.notes.forEach((m, i) => vBell(m, t + i * (e.big ? 0.16 : 0.28), e.big ? 0.75 : 0.55)); break;
    case 'bell': vBell(e.m, t, e.v || 0.5); break;
    case 'tick': vClick(t, e.f, 0.035); break;
    case 'click': vClick(t, 1500 + e.j * 140, 0.022); break;
    case 'bounce': vClick(t, 320, 0.05); break;
    case 'clunk': vClunk(t); break;
    case 'pop': vPop(t); break;
    case 'flap': vFlap(t, e.d, e.small ? 8 : 16, e.small ? 0.03 : 0.05); break;
    case 'stamp': vKick(t, 0.8); vNoise(t, 0.12, 'lowpass', 2000, 300, 0.15, 0.7, 0.2); break;
    case 'riser': vRiser(t, e.d); break;
    case 'kick': vKick(t, 0.9); break;
    case 'hiss': vHiss(t, e.d); break;
    case 'scribble': vScribble(t, e.d); break;
  }
}

// ───────────────────────── player ─────────────────────────
buildTracks(); buildCam(); buildSfx();
const cvs = document.getElementById('film'), ctx = cvs.getContext('2d');
const $ = id => document.getElementById(id);
let playing = false, t = 0, perfAnchor = 0, perfFilm = 0, useAudio = false, dirty = true, ready = false;

function fit() {
  const sw = innerWidth, sh = innerHeight, ar = 16 / 9;
  let w = sw, h = sw / ar; if (h > sh) { h = sh; w = sh * ar; }
  cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
  cvs.style.left = (sw - w) / 2 + 'px'; cvs.style.top = (sh - h) / 2 + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.min(2560, Math.round(w * dpr));
  cvs.width = pw; cvs.height = Math.round(pw / ar);
  dirty = true;
}
addEventListener('resize', fit);

function now() {
  if (!playing) return t;
  if (useAudio && AU.sess) return Math.max(perfFilm, auFilmTime());
  return perfFilm + (performance.now() - perfAnchor) / 1000;
}
function play() {
  if (!ready) return;
  if (t >= TOTAL - 0.05) t = 0;
  playing = true; useAudio = auInit();
  if (useAudio) auStart(t);
  perfAnchor = performance.now(); perfFilm = t;
  $('poster').classList.add('gone'); syncUI(); poke();
}
function pause() { t = now(); playing = false; auStop(); syncUI(); poke(); }
function toggle() { playing ? pause() : play(); }
function seek(x) {
  t = clamp(x, 0, TOTAL - 0.01); dirty = true;
  if (playing) { if (useAudio) auStart(t); perfAnchor = performance.now(); perfFilm = t; }
}
function render(tt) {
  const s = cvs.width / W;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawFrame(ctx, clamp(tt, 0, TOTAL - 0.001));
}
let lastDrawn = -1;
function loop() {
  if (playing) {
    const tt = now();
    if (tt >= TOTAL) { t = TOTAL - 0.01; pause(); }
    else { t = tt; if (useAudio) auTick(tt); }
  }
  if (ready && (playing || dirty || t !== lastDrawn)) { render(t); lastDrawn = t; dirty = false; }
  syncTime();
  requestAnimationFrame(loop);
}

// ── UI
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function syncUI() {
  $('pp').innerHTML = playing ? ICON.pause : ICON.play;
  $('mute').innerHTML = AU.muted ? ICON.mute : ICON.vol;
  document.body.classList.toggle('playing', playing);
}
function syncTime() {
  $('time').textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
  $('fill').style.width = (t / TOTAL * 100) + '%';
  $('knob').style.left = (t / TOTAL * 100) + '%';
  const ch = chapterAt(t); $('chap').textContent = ch ? `0${ch} · ${CHAPTERS[ch].title}` : 'Mind the gap';
}
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>',
  vol: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
  mute: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  fs: '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
};
$('fs').innerHTML = ICON.fs;
// chapter ticks
for (const b of SCRIPT) if (b.card) {
  const d = document.createElement('div'); d.className = 'tick'; d.style.left = (b.s / TOTAL * 100) + '%';
  d.dataset.label = `0${b.card} ${CHAPTERS[b.card].title}`; d.onclick = e => { e.stopPropagation(); seek(b.s + 0.01); };
  $('bar').appendChild(d);
}
let scrubbing = false;
const barX = e => { const r = $('bar').getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * TOTAL; };
$('bar').addEventListener('pointerdown', e => { scrubbing = true; $('bar').setPointerCapture(e.pointerId); seek(barX(e)); });
$('bar').addEventListener('pointermove', e => { const r = $('bar').getBoundingClientRect(); $('hover').style.left = (e.clientX - r.left) + 'px'; $('hover').textContent = fmt(barX(e)); if (scrubbing) seek(barX(e)); });
$('bar').addEventListener('pointerup', () => { scrubbing = false; });
$('pp').onclick = toggle;
$('mute').onclick = () => { auSetMuted(!AU.muted); syncUI(); };
$('fs').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
$('poster').onclick = play;
cvs.addEventListener('click', toggle);
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === 'k') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') seek(t + 5);
  else if (e.key === 'ArrowLeft') seek(t - 5);
  else if (e.key === 'm') { auSetMuted(!AU.muted); syncUI(); }
  else if (e.key === 'f') $('fs').onclick();
  poke();
});
let hideT = 0;
function poke() { document.body.classList.remove('idle'); clearTimeout(hideT); hideT = setTimeout(() => { if (playing) document.body.classList.add('idle'); }, 2600); }
addEventListener('pointermove', poke);

// headless hook for frame checks
window.__frame = tt => { t = tt; render(tt); return true; };
window.__total = TOTAL; window.__play = play; window.__seek = seek; window.__sfx = SFX; window.__now = () => t; window.__au = AU; window.__tickRange = (a, b) => { music(a, b); for (const e of SFX) if (e.t >= a && e.t < b) playSfx(e); }; window.__beats = SCRIPT.map(b => [b.id, b.s, b.e]);

fit();
const faces = ['500 40px "Archivo"', '600 40px "Archivo"', '700 40px "Archivo"', '800 40px "Archivo"', '900 40px "Archivo"',
  'italic 400 40px "Instrument Serif"', '500 20px "JetBrains Mono"', '600 20px "JetBrains Mono"', '700 20px "JetBrains Mono"', '800 20px "JetBrains Mono"'];
Promise.all(faces.map(f => document.fonts.load(f))).catch(() => { }).then(() => {
  ready = true;
  const m = location.hash.match(/t=([\d.]+)/); t = m ? +m[1] : B('title') + 3.4;
  if (!m) { render(t); t = 0; lastDrawn = 0; dirty = false; addEventListener("resize", () => { if (!playing && t === 0) setTimeout(() => { render(B("title") + 3.4); dirty = false; }, 0); }); } else dirty = true;
  $('poster').classList.add('ready');
  syncUI(); window.__ready = true;
});
requestAnimationFrame(loop);

})();
</script>
